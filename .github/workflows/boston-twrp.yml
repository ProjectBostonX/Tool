name: Boston Team Win Recovery Project Builder

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: "Manifest Git URL"
        required: true
        default: "https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git"
        type: string
      MANIFEST_BRANCH:
        description: "Manifest branch"
        required: true
        default: "twrp-12.1"
        type: string
      DEVICE_TREE_URL:
        description: "Boston device-tree Git URL"
        required: true
        default: "https://github.com/PizzaG/android_device_motorola_boston.git"
        type: string
      DEVICE_TREE_BRANCH:
        description: "Boston device-tree branch"
        required: true
        default: "TWRP"
        type: string
      DEVICE_PATH:
        description: "Device-tree path in source checkout"
        required: true
        default: "device/motorola/boston"
        type: string
      PRODUCT:
        description: "Lunch product name (without build variant)"
        required: true
        default: "twrp_boston"
        type: string
      DEVICE_NAME:
        description: "Output product directory"
        required: true
        default: "boston"
        type: string
      BUILD_TARGET:
        description: "Recovery target"
        required: true
        default: "recovery"
        type: string
      COMMON_TREE_URL:
        description: "Optional common-tree URL"
        required: false
        default: ""
        type: string
      COMMON_TREE_BRANCH:
        description: "Optional common-tree branch"
        required: false
        default: ""
        type: string
      COMMON_PATH:
        description: "Optional common-tree path"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      MANIFEST_URL: ${{ inputs.MANIFEST_URL }}
      MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
      DEVICE_TREE_URL: ${{ inputs.DEVICE_TREE_URL }}
      DEVICE_TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }}
      DEVICE_PATH: ${{ inputs.DEVICE_PATH }}
      PRODUCT: ${{ inputs.PRODUCT }}
      DEVICE_NAME: ${{ inputs.DEVICE_NAME }}
      BUILD_TARGET: ${{ inputs.BUILD_TARGET }}
      COMMON_TREE_URL: ${{ inputs.COMMON_TREE_URL }}
      COMMON_TREE_BRANCH: ${{ inputs.COMMON_TREE_BRANCH }}
      COMMON_PATH: ${{ inputs.COMMON_PATH }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses-dev libssl-dev libxml2-utils \
            lzop pngcrush python3 rsync schedtool squashfs-tools unzip wget zip zlib1g-dev

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          for v in "$MANIFEST_URL" "$MANIFEST_BRANCH" "$DEVICE_TREE_URL" "$DEVICE_TREE_BRANCH" "$DEVICE_PATH" "$PRODUCT" "$DEVICE_NAME" "$BUILD_TARGET"; do
            [[ -n "$v" ]] || { echo "A required build input is blank."; exit 1; }
          done
          [[ "$DEVICE_PATH" == device/* ]] || { echo "DEVICE_PATH must start with device/"; exit 1; }
          [[ "$PRODUCT" =~ ^[A-Za-z0-9_-]+$ && "$DEVICE_NAME" =~ ^[A-Za-z0-9_-]+$ && "$BUILD_TARGET" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "Invalid product, device or target name"; exit 1; }
          [[ "$MANIFEST_URL" == https://* && "$DEVICE_TREE_URL" == https://* ]] || { echo "Use HTTPS Git URLs"; exit 1; }

      - name: Initialize manifest
        run: |
          mkdir -p workspace
          cd workspace
          repo init --depth=1 -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH"

      - name: Sync source
        run: |
          cd workspace
          repo sync -c --no-clone-bundle --no-tags -j"$(nproc --all)" --force-sync

      - name: Clone Boston device tree
        run: |
          cd workspace
          mkdir -p "$(dirname "$DEVICE_PATH")"
          git clone --depth=1 --branch "$DEVICE_TREE_BRANCH" "$DEVICE_TREE_URL" "$DEVICE_PATH"

      - name: Clone optional common tree
        if: ${{ inputs.COMMON_TREE_URL != '' && inputs.COMMON_PATH != '' }}
        run: |
          cd workspace
          mkdir -p "$(dirname "$COMMON_PATH")"
          if [[ -n "$COMMON_TREE_BRANCH" ]]; then
            git clone --depth=1 --branch "$COMMON_TREE_BRANCH" "$COMMON_TREE_URL" "$COMMON_PATH"
          else
            git clone --depth=1 "$COMMON_TREE_URL" "$COMMON_PATH"
          fi

      - name: Build recovery
        shell: bash
        run: |
          set -euo pipefail
          cd workspace
          export ALLOW_MISSING_DEPENDENCIES=true LC_ALL=C
          source build/envsetup.sh
          lunch "${ "{" }PRODUCT{ "}" }-eng"
          mka "${ "{" }BUILD_TARGET{ "}" }image" -j"$(nproc --all)"
          test -s "out/target/product/${ "{" }DEVICE_NAME{ "}" }/${ "{" }BUILD_TARGET{ "}" }.img"

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: boston-twrp-recovery
          path: workspace/out/target/product/${{ inputs.DEVICE_NAME }}/${{ inputs.BUILD_TARGET }}.img
          if-no-files-found: error
          retention-days: 14
